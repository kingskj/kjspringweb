# turtlepick agent - machine profile: lenovo (notebook)
#
# Select with JVM arg on the target server:
#   -Dturtlepick.config=D:/workspace/kjspringweb/turtlepick-lenovo.properties
#
# Agent log check:
#   OK      -> "config loaded path=...turtlepick-lenovo.properties"  (file name must match)
#   bad arg -> "config file not found: <path>"      (explicit -Dturtlepick.config is wrong)
#   no arg  -> "turtlepick.properties not found"    (fallback exhausted) + "startup failed; agent disabled"
#
# ASCII only, UTF-8 without BOM. A BOM breaks the first key in java.util.Properties.

turtlepick.engine.base-url=http://localhost:9000
turtlepick.engine.meta.timeout-ms=3000

turtlepick.agent.server-id=kjspringweb-local
turtlepick.agent.app-name=kjspringweb
turtlepick.agent.git.repo-root=D:/workspace/kjspringweb

# Must match the engine spool path: {storage.spool-dir}/{server-id}
turtlepick.agent.logging.dir=D:/turtlepick/runtime/spool/kjspringweb-local
turtlepick.agent.logging.rolling.interval-minutes=5
turtlepick.agent.logging.verbose-field-names=true
turtlepick.agent.error.user-frame-packages=com.kjweb
turtlepick.agent.error.args.enabled=true
turtlepick.agent.error.args.max-length=10000
turtlepick.agent.error.args.exclude-classes=java.io.InputStream,java.io.Reader,java.io.File,java.nio.ByteBuffer,org.springframework.web.multipart.MultipartFile,byte[],char[]

turtlepick.agent.slow.enabled=true
turtlepick.agent.slow.threshold-ms=100

turtlepick.agent.instrumentation.http=true
turtlepick.agent.instrumentation.service=true
turtlepick.agent.instrumentation.sql.datasource-proxy=true
turtlepick.agent.instrumentation.sql.mybatis-interceptor=false

# The two instrumentation.sql.* keys above are read into AgentConfig,
# but currently have no consumers and do not enable SQL capture.
# The actual SQL capture switch below defaults to false.
# Left unset on purpose: enabling it changes target-server load.
# turtlepick.agent.sql.capture.enabled=true
